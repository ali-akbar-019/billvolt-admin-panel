<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16746f"/>
      <stop offset="100%" stop-color="#105e5a"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#083c39" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="18"
    fill="url(#bg)"
  />

  <!-- subtle highlight -->
  <path
    d="M8 8h48c0 11-8 18-24 18S8 19 8 8z"
    fill="url(#shine)"
  />

  <!-- Stylized B -->
  <g fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M23 17v30"/>
    <path d="M23 17h11a7 7 0 010 14H23"/>
    <path d="M23 31h12a8 8 0 010 16H23"/>
  </g>

  <!-- Medical Cross -->
  <g fill="#E8F4F2">
    <rect x="43" y="18" width="10" height="3" rx="1.5"/>
    <rect x="46.5" y="14.5" width="3" height="10" rx="1.5"/>
  </g>
</svg>