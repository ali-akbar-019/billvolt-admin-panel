# Render deployment config for the backend API.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: billvolt-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # set manually in the Render dashboard — don't commit real URIs
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: CLIENT_URL
        sync: false # set to your deployed Vercel URL once you have it
